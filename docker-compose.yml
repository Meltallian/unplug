name: unplug

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://unplug:${POSTGRES_PASSWORD}@postgres:5432/unplug
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
  volumes:
    - ${DATA_ROOT:-/home/ubuntu/unplug-data}/songs:/data/songs
    - ${DATA_ROOT:-/home/ubuntu/unplug-data}/secrets:/data/secrets:ro
    - ${DATA_ROOT:-/home/ubuntu/unplug-data}/fixtures:/data/fixtures:ro
    - ${DATA_ROOT:-/home/ubuntu/unplug-data}/eval:/data/eval
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://unplug:${POSTGRES_PASSWORD}@postgres:5432/unplug
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: celery -A app.tasks worker --concurrency=2 --prefetch-multiplier=1 --loglevel=info

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unplug
      POSTGRES_DB: unplug
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT:-/home/ubuntu/unplug-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unplug"]
      interval: 5s
      retries: 10
    restart: unless-stopped
