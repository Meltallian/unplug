[project]
name = "unplug"
version = "0.1.0"
description = "Private YouTube-to-guitar-chord-sheet app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "yt-dlp[default]>=2026.10.26",
    "alembic>=1.14",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "weasyprint>=63.0",
    "verovio>=6.4,<7",
    "beat-this>=1.1.0",
    "torch>=2.5",
    "torchaudio>=2.5",
]

# CPU-only PyTorch (the default wheels pull in ~3 GB of CUDA libraries)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = ["pytest>=8.3", "mir_eval>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
